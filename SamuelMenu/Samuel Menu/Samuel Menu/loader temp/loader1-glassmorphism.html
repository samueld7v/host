<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperX - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a0a0a, #0f0a0a);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,26,38,0.15), transparent 70%);
            top: -100px; right: -100px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,26,38,0.1), transparent 70%);
            bottom: -80px; left: -80px;
            border-radius: 50%;
        }

        .glass-card {
            background: rgba(10,10,15,0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,26,38,0.08);
            border-radius: 28px;
            padding: 44px 38px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 40px rgba(255,26,38,0.02);
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 70px; height: 70px;
            background: rgba(255,26,38,0.08);
            border: 1px solid rgba(255,26,38,0.15);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px; font-weight: 900;
            color: rgba(255,255,255,0.6);
            box-shadow: 0 0 30px rgba(255,26,38,0.06);
        }

        .tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,26,38,0.04);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #555;
            font-size: 16px;
            font-weight: 700;
            border-radius: 11px;
            transition: all 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #ff1a26, #cc0d15);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,26,38,0.3);
        }

        .form { display: flex; flex-direction: column; gap: 16px; }
        .form.hidden { display: none; }

        .input-group {
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.12);
            font-size: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,26,38,0.04);
            border-radius: 12px;
            color: #ddd;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: rgba(255,26,38,0.2);
            box-shadow: 0 0 15px rgba(255,26,38,0.04);
        }
        .input-group input::placeholder { color: #444; }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff1a26, #cc0d15);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,26,38,0.3);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
        }
        .remember input {
            appearance: none;
            width: 17px; height: 17px;
            border: 2px solid rgba(255,26,38,0.12);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
        }
        .remember input:checked {
            background: #ff1a26;
            border-color: #ff1a26;
        }
        .remember input:checked::after {
            content: '✓';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
        }

        .msg {
            text-align: center;
            font-size: 13px;
            min-height: 20px;
            margin-top: 4px;
        }
        .msg.error { color: #ff1a26; }
        .msg.success { color: #22c55e; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo">L</div>

        <div class="tabs">
            <button class="tab active" data-tab="login">Login</button>
            <button class="tab" data-tab="register">Register</button>
        </div>

        <form class="form" id="loginForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Password">
            </div>
            <label class="remember">
                <input type="checkbox"> Remember me
            </label>
            <button class="btn" type="button">LOGIN</button>
        </form>

        <form class="form hidden" id="registerForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Password">
            </div>
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" placeholder="License Key">
            </div>
            <button class="btn" type="button">REGISTER</button>
        </form>

        <div class="msg" id="message"></div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const forms = { login: document.getElementById('loginForm'), register: document.getElementById('registerForm') };
        const msg = document.getElementById('message');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                Object.values(forms).forEach(f => f.classList.add('hidden'));
                forms[tab.dataset.tab].classList.remove('hidden');
                msg.textContent = '';
            });
        });

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                msg.textContent = 'Connecting to server...';
                msg.className = 'msg';
                setTimeout(() => {
                    msg.textContent = '✓ Authenticated successfully!';
                    msg.className = 'msg success';
                }, 1500);
            });
        });
    </script>
</body>
</html>
